[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-agent"
version = "0.1.0"
description = "Evidence-first RFP qualification workflow"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "openai>=3.5,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19,<2",
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.5,<1",
    "pymupdf>=1.28,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "python-multipart>=0.0.32,<1",
]

eval = [
    "pandas>=3.0,<4",
]

ui = [
    "streamlit>=1.62,<2",
]

dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<1",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "external: tests that call external APIs and may incur cost",
    "integration: tests requiring PostgreSQL or other services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_return_any = true
